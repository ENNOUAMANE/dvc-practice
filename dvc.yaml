stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - data/validated.csv
    - src/prepare.py
    outs:
    - data/processed.csv
  train:
    cmd: python src/train.py
    deps:
    - data/processed.csv
    - src/train.py
    params:
    - train.random_state
    - train.test_size
    outs:
    - data/test.csv
    - models/model.pkl
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/test.csv
    - models/model.pkl
    - src/evaluate.py
    metrics:
    - metrics.json:
        cache: false
    params:
    - train.test_size
    plots:
    - plots/accuracy.csv:
        cache: false
  validate:
    cmd: python src/validate.py
    deps:
    - data/dataset.csv
    - src/validate.py
    outs:
    - data/validated.csv
